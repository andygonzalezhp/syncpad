spring.application.name=syncpad-api

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/syncpad
spring.datasource.username=syncpad
spring.datasource.password=syncpad

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Clerk JWT verification.
# Set this in your shell before running Spring Boot:
# export CLERK_JWKS_URL="https://YOUR_CLERK_FRONTEND_API/.well-known/jwks.json"
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URL}